<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Interactive - Ferme de Chevronsart</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Indique au téléphone de charger l'image en priorité absolue pour la vitesse -->
    <link rel="preload" as="image" href="images/Illustration ferme 1.jpg">
</head>
<body class="page-carte">

    <header>
        <h1>Ferme de Chevronsart</h1>
        <p>Touchez un bâtiment ou un animal pour explorer</p>
    </header>

    <main>
        <div class="map-container">

            <img src="images/Illustration ferme 1.jpg" alt="Carte de la Ferme" id="carte-ferme">
            
            <!-- Le calque SVG interactif qui se superpose -->
            <svg class="calque-interactif" viewBox="0 0 1200 850" preserveAspectRatio="xMidYMid meet">
                
                <!-- A: Barbecue -->

                <!-- C: Caprins -->
                <a href="pages/caprins.html"><circle cx="200" cy="480" r="35" class="zone-cliquable" /></a>
                
                <!-- D: Mare -->
                <a href="pages/mare.html"><circle cx="150" cy="560" r="35" class="zone-cliquable" /></a>
                
                <!-- E: Bovins -->
                <a href="pages/bovins.html"><circle cx="435" cy="378" r="35" class="zone-cliquable" /></a>
                
                <!-- F: Logement -->
                <a href="pages/logement.html"><circle cx="400" cy="490" r="30" class="zone-cliquable" /></a>
                
                <!-- G: Porcs -->
                <a href="pages/porcs.html"><circle cx="390" cy="610" r="35" class="zone-cliquable" /></a>
                
                <!-- H: Boulangerie -->
                <a href="pages/boulangerie.html"><circle cx="530" cy="530" r="35" class="zone-cliquable" /></a>
                
                <!-- I: Cultures -->
                <a href="pages/cultures.html"><circle cx="680" cy="380" r="25" class="zone-cliquable" /></a>
                
                <!-- S: Chèvrerie (Insérée en ellipse sous I et au-dessus de J/K) -->
                <a href="pages/chevrerie.html"><ellipse cx="650" cy="420" rx="25" ry="10" class="zone-cliquable" /></a>
                
                <!-- J: Étable -->
                <a href="pages/etable.html"><circle cx="610" cy="450" r="20" class="zone-cliquable" /></a>
                
                <!-- K: Laiterie -->
                <a href="pages/laiterie.html"><circle cx="660" cy="450" r="20" class="zone-cliquable" id="centre-carte" /></a>
                
                <!-- L: Fromagerie -->
                <a href="pages/fromagerie.html"><circle cx="695" cy="430" r="20" class="zone-cliquable" /></a>
                
                <!-- M: Boucherie -->
                <a href="pages/boucherie.html"><circle cx="625" cy="515" r="20" class="zone-cliquable" /></a>

                <a href="pages/place-des-fetes.html"><circle cx="700" cy="467" r="15" class="zone-cliquable zone-foncee" /></a>

                <a href="pages/communs.html"><circle cx="740" cy="480" r="20" class="zone-cliquable" /></a>

   <!-- 1. On charge le moteur de zoom depuis internet -->
    <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

    <!-- 2. On l'applique sur notre carte -->
    <script>
        const imageCarte = document.getElementById('carte-ferme');
        
        function initialiserCarte() {
            const mapContainer = document.querySelector('.map-container');
            const centre = document.getElementById('centre-carte');
            const mainZone = document.querySelector('main');
            
            const monPanzoom = Panzoom(mapContainer, {
                maxScale: 4, /* J'ai augmenté un peu le zoom max pour un meilleur effet "plongeon" */
                minScale: 0.3,
                step: 0.1,
                animate: true /* Active les animations fluides */
            });

            mapContainer.parentElement.addEventListener('wheel', monPanzoom.zoomWithWheel);

            // Centrage automatique au lancement
            setTimeout(function() {
                if (centre && mainZone) {
                    const rect = centre.getBoundingClientRect();
                    const mainRect = mainZone.getBoundingClientRect();
                    const moveX = (mainRect.width / 2) - (rect.left + rect.width / 2);
                    const moveY = (mainRect.height / 2) - (rect.top + rect.height / 2);
                    monPanzoom.pan(moveX, moveY);
                }
            }, 50); 

           // ==========================================
            // NOUVEAU : Effet "On rentre dedans" ULTRA FLUIDE ET PRÉCIS (CSS)
            // ==========================================
            const liens = document.querySelectorAll('.calque-interactif a');
            liens.forEach(lien => {
                lien.addEventListener('click', function(e) {
                    e.preventDefault(); 
                    const url = this.getAttribute('href');

                    // 1. On cible la zone principale et le cercle précis qu'on a cliqué
                    const mainZone = document.querySelector('main');
                    const cercle = this.querySelector('.zone-cliquable');
                    
                    // 2. On calcule la position exacte du centre du cercle par rapport à la page
                    const rectCercle = cercle.getBoundingClientRect();
                    const rectMain = mainZone.getBoundingClientRect();
                    
                    const centreX = (rectCercle.left + rectCercle.width / 2) - rectMain.left;
                    const centreY = (rectCercle.top + rectCercle.height / 2) - rectMain.top;
                    
                    // 3. On définit ce centre exact comme point de départ du zoom
                    mainZone.style.transformOrigin = centreX + "px " + centreY + "px";
                    
                    // 4. On active l'accélération matérielle CSS (super fluide)
                    mainZone.style.transition = "transform 0.5s ease-in, opacity 0.5s ease-in";
                    
                    // 5. On zoome fort (scale) et on fond au noir (opacity)
                    mainZone.style.transform = "scale(4)";
                    mainZone.style.opacity = "0";

                    // 6. On charge la page une fois l'animation terminée
                    setTimeout(() => {
                        window.location.href = url;
                    }, 500);
                });
            });
        }

        if (imageCarte.complete) {
            initialiserCarte();
        } else {
            imageCarte.addEventListener('load', initialiserCarte);
        }

// ==========================================
// Scintillement 100% aléatoire (Clair & Foncé)
// ==========================================
// On sélectionne à la fois les cercles normaux ET le cercle de la place des fêtes
const zones = document.querySelectorAll('.zone-cliquable, .zone-foncee');

function programmerScintillement(zone) {
    // 1. On vérifie s'il s'agit de la zone foncée pour choisir la bonne animation
    const classeAnimation = zone.classList.contains('zone-foncee') ? 'scintillement-foncee-actif' : 'scintillement-actif';
    
    // 2. On allume le cercle
    zone.classList.add(classeAnimation);
    
    // 3. On attend la fin de l'animation CSS (2000 ms) pour l'éteindre
    setTimeout(() => {
        zone.classList.remove(classeAnimation);
        
        // 4. On tire au sort le PROCHAIN délai (entre 5s et 10s)
        const prochainDelai = Math.random() * (10000 - 5000) + 5000;
        
        // 5. On programme la prochaine apparition
        setTimeout(() => programmerScintillement(zone), prochainDelai);
        
    }, 2000); 
}

// Au chargement, on lance le premier cycle avec un délai de départ entre 0 et 8 secondes
zones.forEach(zone => {
    const premierDelai = Math.random() * 8000;
    setTimeout(() => programmerScintillement(zone), premierDelai);
});   


 </script>




</body>
</html>
