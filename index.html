<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carte Interactive - Ferme de Chevronsart</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Indique au téléphone de charger l'image en priorité absolue pour la vitesse -->
    <link rel="preload" as="image" href="images/Illustration ferme 1.jpg">
</head>
<body class="page-carte">

    <header>
        <h1>Ferme de Chevronsart</h1>
        <p>Touchez un bâtiment ou un animal pour explorer</p>
    </header>

    <main>
        <div class="map-container">
            <!-- L'image de fond principale -->
            <img src="images/Illustration ferme 1.jpg" alt="Carte de la Ferme" id="carte-ferme">
            
            <!-- Le calque SVG interactif qui se superpose -->
            <svg class="calque-interactif" viewBox="0 0 1200 850" preserveAspectRatio="xMidYMid meet">
                
                <!-- A: Barbecue -->
                <a href="pages/barbecue.html"><circle cx="280" cy="350" r="35" class="zone-cliquable" /></a>
                
                <!-- B: Poulailler -->
                <a href="pages/poulailler.html"><circle cx="210" cy="420" r="35" class="zone-cliquable" /></a>
                
                <!-- C: Caprins -->
                <a href="pages/caprins.html"><circle cx="230" cy="510" r="35" class="zone-cliquable" /></a>
                
                <!-- D: Marre -->
                <a href="pages/marre.html"><circle cx="170" cy="590" r="45" class="zone-cliquable" /></a>
                
                <!-- E: Bovins -->
                <a href="pages/bovins.html"><circle cx="430" cy="390" r="40" class="zone-cliquable" /></a>
                
                <!-- F: Logement -->
                <a href="pages/logement.html"><circle cx="400" cy="510" r="35" class="zone-cliquable" /></a>
                
                <!-- G: Porcs -->
                <a href="pages/porcs.html"><circle cx="390" cy="620" r="45" class="zone-cliquable" /></a>
                
                <!-- H: Boulangerie -->
                <a href="pages/boulangerie.html"><circle cx="530" cy="550" r="35" class="zone-cliquable" /></a>
                
                <!-- I: Cultures -->
                <a href="pages/cultures.html"><circle cx="670" cy="380" r="30" class="zone-cliquable" /></a>
                
                <!-- S: Chèvrerie (Insérée en ellipse sous I et au-dessus de J/K) -->
                <a href="pages/chevrerie.html"><ellipse cx="655" cy="430" rx="35" ry="20" class="zone-cliquable" /></a>
                
                <!-- J: Étable -->
                <a href="pages/etable.html"><circle cx="610" cy="470" r="30" class="zone-cliquable" /></a>
                
                <!-- K: Laiterie -->
                <a href="pages/laiterie.html"><circle cx="670" cy="470" r="30" class="zone-cliquable" id="centre-carte" /></a>
                
                <!-- L: Fromagerie -->
                <a href="pages/fromagerie.html"><circle cx="720" cy="440" r="30" class="zone-cliquable" /></a>
                
                <!-- M: Boucherie -->
                <a href="pages/boucherie.html"><circle cx="620" cy="530" r="30" class="zone-cliquable" /></a>
                
                <!-- N: Magasin -->
                <a href="pages/magasin.html"><circle cx="675" cy="530" r="30" class="zone-cliquable" /></a>
                
                <!-- O: Place des Fêtes -->
                <a href="pages/place-des-fetes.html"><circle cx="725" cy="500" r="30" class="zone-cliquable" /></a>
                
                <!-- P: Communs -->
                <a href="pages/communs.html"><circle cx="770" cy="500" r="30" class="zone-cliquable" /></a>
                
                <!-- Q: Pédagogique -->
                <a href="pages/pedagogique.html"><circle cx="760" cy="565" r="35" class="zone-cliquable" /></a>
                
                <!-- R: Verger (Très grand cercle) -->
                <a href="pages/verger.html"><circle cx="1020" cy="420" r="140" class="zone-cliquable" /></a>
                
            </svg>
        </div>
    </main>

    <!-- 1. On charge le moteur de zoom depuis internet -->
    <script src="https://cdn.jsdelivr.net/npm/@panzoom/panzoom@4.5.1/dist/panzoom.min.js"></script>

    <!-- 2. On l'applique sur notre carte -->
    <script>
        const imageCarte = document.getElementById('carte-ferme');
        
        function initialiserCarte() {
            const mapContainer = document.querySelector('.map-container');
            const centre = document.getElementById('centre-carte');
            const mainZone = document.querySelector('main');
            
            const monPanzoom = Panzoom(mapContainer, {
                maxScale: 3,
                minScale: 0.3,
                step: 0.1,
                animate: true
            });

            mapContainer.parentElement.addEventListener('wheel', monPanzoom.zoomWithWheel);

            // Centrage automatique
            setTimeout(function() {
                if (centre && mainZone) {
                    const rect = centre.getBoundingClientRect();
                    const mainRect = mainZone.getBoundingClientRect();
                    const moveX = (mainRect.width / 2) - (rect.left + rect.width / 2);
                    const moveY = (mainRect.height / 2) - (rect.top + rect.height / 2);
                    monPanzoom.pan(moveX, moveY);
                }
            }, 50); 
        }

        if (imageCarte.complete) {
            initialiserCarte();
        } else {
            imageCarte.addEventListener('load', initialiserCarte);
        }
    </script>
</body>
</html>
